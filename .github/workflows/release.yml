name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/gpg-wrapper \
            target/x86_64-apple-darwin/release/gpg-wrapper \
            -output target/universal-apple-darwin/release/gpg-wrapper
          file target/universal-apple-darwin/release/gpg-wrapper

      - name: Install icon conversion tools
        run: brew install librsvg

      - name: Package app and DMG
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          APP="dist/GPG Wrapper.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources" dist

          cp target/universal-apple-darwin/release/gpg-wrapper "${APP}/Contents/MacOS/gpg-wrapper"
          cp assets/gpg-wrapper-padlock.svg "${APP}/Contents/Resources/gpg-wrapper-padlock.svg"
          chmod +x "${APP}/Contents/MacOS/gpg-wrapper"
          # Convert the SVG to the native macOS .icns format and register it
          # in the bundle metadata. The SVG remains as a fallback resource.
          mkdir -p /tmp/gpg-wrapper.iconset
          rsvg-convert -w 16 -h 16 assets/gpg-wrapper-padlock.svg -o /tmp/gpg-wrapper.iconset/icon_16x16.png
          rsvg-convert -w 32 -h 32 assets/gpg-wrapper-padlock.svg -o /tmp/gpg-wrapper.iconset/icon_16x16@2x.png
          rsvg-convert -w 32 -h 32 assets/gpg-wrapper-padlock.svg -o /tmp/gpg-wrapper.iconset/icon_32x32.png
          rsvg-convert -w 64 -h 64 assets/gpg-wrapper-padlock.svg -o /tmp/gpg-wrapper.iconset/icon_32x32@2x.png
          rsvg-convert -w 128 -h 128 assets/gpg-wrapper-padlock.svg -o /tmp/gpg-wrapper.iconset/icon_128x128.png
          rsvg-convert -w 256 -h 256 assets/gpg-wrapper-padlock.svg -o /tmp/gpg-wrapper.iconset/icon_128x128@2x.png
          rsvg-convert -w 256 -h 256 assets/gpg-wrapper-padlock.svg -o /tmp/gpg-wrapper.iconset/icon_256x256.png
          rsvg-convert -w 512 -h 512 assets/gpg-wrapper-padlock.svg -o /tmp/gpg-wrapper.iconset/icon_256x256@2x.png
          rsvg-convert -w 512 -h 512 assets/gpg-wrapper-padlock.svg -o /tmp/gpg-wrapper.iconset/icon_512x512.png
          rsvg-convert -w 1024 -h 1024 assets/gpg-wrapper-padlock.svg -o /tmp/gpg-wrapper.iconset/icon_512x512@2x.png
          iconutil -c icns /tmp/gpg-wrapper.iconset -o "${APP}/Contents/Resources/gpg-wrapper-padlock.icns"
          cat > "${APP}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>GPG Wrapper</string>
            <key>CFBundleExecutable</key><string>gpg-wrapper</string>
            <key>CFBundleIdentifier</key><string>com.isroot.gpg-wrapper</string>
            <key>CFBundleIconFile</key><string>gpg-wrapper-padlock</string>
            <key>CFBundleIconName</key><string>gpg-wrapper-padlock</string>
            <key>CFBundleName</key><string>GPG Wrapper</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>CFBundleVersion</key><string>${VERSION#v}</string>
          </dict></plist>
          PLIST
          plutil -lint "${APP}/Contents/Info.plist"
          codesign --force --deep --sign - "${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"

          hdiutil create -volname "GPG Wrapper ${VERSION}" \
            -srcfolder "dist/GPG Wrapper.app" \
            -ov -format UDZO "dist/gpg-wrapper-${VERSION}-macos-universal.dmg"

          shasum -a 256 "dist/gpg-wrapper-${VERSION}-macos-universal.dmg" > dist/SHA256SUMS-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/SHA256SUMS-macos

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          PACKAGE="gpg-wrapper-${VERSION}-linux-x86_64.tar.gz"

          mkdir -p dist/package

          cp target/release/gpg-wrapper dist/package/
          cp README.md dist/package/
          cp gpg-wrapper.desktop dist/package/
          cp assets/gpg-wrapper-padlock.svg dist/package/

          tar -czf "dist/${PACKAGE}" -C dist/package .

          echo "Created:"
          ls -lh "dist/${PACKAGE}"

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail

          APPDIR="dist/GPGWrapper.AppDir"
          mkdir -p "${APPDIR}/usr/bin" "${APPDIR}/usr/share/applications" "${APPDIR}/usr/share/icons/hicolor/scalable/apps"
          cp target/release/gpg-wrapper "${APPDIR}/usr/bin/gpg-wrapper"
          cp gpg-wrapper.desktop "${APPDIR}/usr/share/applications/gpg-wrapper.desktop"
          cp gpg-wrapper.desktop "${APPDIR}/gpg-wrapper.desktop"
          cp assets/gpg-wrapper-padlock.svg "${APPDIR}/usr/share/icons/hicolor/scalable/apps/gpg-wrapper-padlock.svg"
          cp assets/gpg-wrapper-padlock.svg "${APPDIR}/gpg-wrapper-padlock.svg"
          cat > "${APPDIR}/AppRun" <<'APPRUN'
          #!/bin/sh
          exec "$(dirname "$0")/usr/bin/gpg-wrapper" "$@"
          APPRUN
          chmod +x "${APPDIR}/AppRun"

          curl -L --fail --retry 3 -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          ARCH=x86_64 /tmp/appimagetool.AppImage "${APPDIR}" "dist/gpg-wrapper-${GITHUB_REF_NAME}-linux-x86_64.AppImage"

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum ./*.tar.gz ./*.AppImage > SHA256SUMS

          echo "Checksums:"
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS
