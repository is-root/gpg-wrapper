name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package app and DMG
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          APP="dist/GPG Wrapper.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources" dist

          cp target/release/gpg-wrapper "${APP}/Contents/MacOS/gpg-wrapper"
          chmod +x "${APP}/Contents/MacOS/gpg-wrapper"
          cat > "${APP}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>GPG Wrapper</string>
            <key>CFBundleExecutable</key><string>gpg-wrapper</string>
            <key>CFBundleIdentifier</key><string>com.isroot.gpg-wrapper</string>
            <key>CFBundleName</key><string>GPG Wrapper</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>CFBundleVersion</key><string>${VERSION#v}</string>
          </dict></plist>
          PLIST

          hdiutil create -volname "GPG Wrapper ${VERSION}" \
            -srcfolder "dist/GPG Wrapper.app" \
            -ov -format UDZO "dist/gpg-wrapper-${VERSION}-macos.dmg"

          shasum -a 256 "dist/gpg-wrapper-${VERSION}-macos.dmg" > dist/SHA256SUMS-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/SHA256SUMS-macos

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          PACKAGE="gpg-wrapper-${VERSION}-linux-x86_64.tar.gz"

          mkdir -p dist/package

          cp target/release/gpg-wrapper dist/package/
          cp README.md dist/package/
          cp gpg-wrapper.desktop dist/package/

          tar -czf "dist/${PACKAGE}" -C dist/package .

          echo "Created:"
          ls -lh "dist/${PACKAGE}"

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS

          echo "Checksums:"
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
